<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Age picker — wheel concept</title>
<style>
  :root {
    color-scheme: dark;
    --text: #f5f5f7;
    --secondary: rgba(235, 235, 245, .56);
    --tertiary: rgba(235, 235, 245, .3);
    --panel: #1c1c1e;
    --rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(900px 620px at 50% 12%, rgba(52, 170, 126, .2), transparent 66%),
      radial-gradient(800px 700px at 82% 88%, rgba(18, 92, 70, .24), transparent 62%),
      radial-gradient(1100px 900px at 20% 80%, rgba(26, 40, 38, .9), transparent 70%),
      #0d1211;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 48px 24px;
  }

  /* ——— popover ——— */

  .popover {
    width: 300px;
    padding: 22px 20px 14px;
    border-radius: 14px;
    background:
      linear-gradient(180deg, rgba(44, 44, 46, .9), rgba(28, 28, 30, .94));
    border: 1px solid rgba(255, 255, 255, .09);
    box-shadow:
      0 32px 90px rgba(0, 0, 0, .62),
      0 10px 30px rgba(0, 0, 0, .4),
      inset 0 1px 0 rgba(255, 255, 255, .06);
    backdrop-filter: blur(40px) saturate(1.25);
    -webkit-backdrop-filter: blur(40px) saturate(1.25);
    animation: rise .55s cubic-bezier(.2, .8, .2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }

  /* ——— hero ——— */

  .hero {
    min-height: 78px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .hero-copy {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .count {
    font-family: var(--rounded);
    font-size: 54px;
    font-weight: 600;
    line-height: .88;
    letter-spacing: -1.5px;
    font-variant-numeric: tabular-nums;
    transform-origin: left center;
  }

  .summary {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.25;
    color: var(--secondary);
    white-space: nowrap;
  }

  .summary.dim { color: var(--tertiary); }

  /* ——— card stack ——— */

  .stack {
    position: relative;
    flex: 0 0 136px;
    width: 136px;
    height: 78px;
  }

  .card {
    position: absolute;
    left: 20px;
    top: 7px;
    width: 96px;
    height: 64px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, .22);
    box-shadow: 0 7px 16px rgba(0, 0, 0, .42);
    transition: transform .55s cubic-bezier(.2, .8, .2, 1);
  }

  .card.back {
    z-index: 1;
    background: linear-gradient(150deg, #505056, #2d2d32);
    transform: rotate(-7deg) translate(-12px, 2px);
    opacity: .9;
  }

  .card.purple {
    z-index: 2;
    background: linear-gradient(150deg, #9a8bff, #6c5ce7);
    transform: rotate(7deg) translate(10px, 1px);
  }

  .card.yellow {
    z-index: 3;
    padding: 5px;
    background: linear-gradient(155deg, #ffcd55, #f2a71b);
    transform: rotate(-2deg);
  }

  .stack:hover .card.back   { transform: rotate(-10deg) translate(-16px, 2px); }
  .stack:hover .card.purple { transform: rotate(10deg) translate(14px, 1px); }
  .stack:hover .card.yellow { transform: rotate(-1deg) translateY(-1px); }

  .browser {
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 4px;
    background: #fffdf6;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .18);
  }

  .browser-bar {
    height: 9px;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 4px;
    background: #f1ecdf;
  }

  .browser-bar i {
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #c8c0ac;
  }

  .browser-body {
    height: calc(100% - 9px);
    display: flex;
    gap: 4px;
    padding: 4px;
  }

  .browser-side {
    width: 14px;
    border-radius: 2px;
    background: #e9e4d7;
  }

  .browser-lines {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }

  .browser-lines span {
    height: 4px;
    border-radius: 2px;
    background: #f6d77c;
  }

  .browser-lines span:nth-child(2) { width: 76%; }
  .browser-lines span:nth-child(3) { width: 88%; }
  .browser-lines span:nth-child(4) { width: 58%; }

  /* ——— age row ——— */

  .age-row {
    height: 30px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .caption {
    width: 80px;
    font-size: 12px;
    font-weight: 500;
    color: var(--secondary);
    white-space: nowrap;
  }

  .picker {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .all-btn {
    width: 44px;
    height: 30px;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: #a9abac;
    font-family: var(--rounded);
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    transition: background .18s ease, color .18s ease, transform .12s ease, box-shadow .18s ease;
  }

  .all-btn:hover {
    color: #d6d8da;
    background: rgba(255, 255, 255, .07);
  }

  .all-btn.selected {
    color: #d6d8da;
    background: #414347;
    box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .07);
  }

  .all-btn.selected:hover { background: #484a4e; color: #e5e7e9; }

  .all-btn:active { transform: scale(.95); }

  .all-btn:focus-visible,
  .wheel:focus,
  .clean:focus-visible,
  .power:focus-visible {
    outline: 2px solid rgba(10, 132, 255, .85);
    outline-offset: 2px;
  }

  /* ——— wheel ——— */

  .wheel {
    position: relative;
    width: 90px;
    height: 30px;
    border-radius: 999px;
    overflow: hidden;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    background:
      radial-gradient(75% 140% at 50% 46%, rgba(255, 255, 255, .08), transparent 72%),
      linear-gradient(180deg, #4a4c50 0%, #414347 48%, #393b3f 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .1),
      inset 0 -1px 0 rgba(0, 0, 0, .3),
      inset 0 0 0 .5px rgba(255, 255, 255, .06),
      0 1px 2px rgba(0, 0, 0, .2);
    transition: filter .18s ease, opacity .2s ease, box-shadow .2s ease, transform .18s ease;
  }

  .wheel:hover {
    filter: brightness(1.07);
    transform: scale(1.015);
  }

  .wheel:active { transform: scale(.99); }

  .wheel.is-active {
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .12),
      inset 0 -1px 0 rgba(0, 0, 0, .3),
      inset 0 0 0 .5px rgba(255, 255, 255, .07),
      0 1px 2px rgba(0, 0, 0, .22);
  }

  .wheel.is-inactive {
    background:
      radial-gradient(75% 140% at 50% 46%, rgba(255, 255, 255, .035), transparent 72%),
      linear-gradient(180deg, #333539 0%, #2c2e31 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .05),
      inset 0 -1px 0 rgba(0, 0, 0, .28),
      inset 0 0 0 .5px rgba(255, 255, 255, .04),
      0 1px 2px rgba(0, 0, 0, .18);
  }

  .wheel.is-inactive .num {
    color: #b0b2b4;
    text-shadow: none;
  }

  .wheel.is-inactive .unit { color: #85888c; }

  .wheel.is-dragging {
    cursor: grabbing;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .16),
      inset 0 -1px 0 rgba(0, 0, 0, .3),
      inset 0 0 0 .5px rgba(255, 255, 255, .08),
      0 2px 10px rgba(0, 0, 0, .28);
  }

  .wheel-window {
    position: absolute;
    inset: 3px 12px;
    overflow: hidden;
  }

  .wheel-value {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    will-change: transform, opacity;
  }

  .wheel-value .val {
    display: inline-flex;
    align-items: baseline;
    gap: 2px;
    white-space: nowrap;
  }

  .wheel-value .num {
    font-family: var(--rounded);
    font-size: 14px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -.3px;
    font-variant-numeric: tabular-nums;
    color: #e4e6e8;
    text-shadow:
      0 1px 1px rgba(0, 0, 0, .25),
      0 0 10px rgba(255, 255, 255, .1);
  }

  .wheel-value .num.word {
    font-size: 13px;
    letter-spacing: 0;
  }

  .wheel-value .unit {
    font-size: 9px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: .1px;
    color: #a9abac;
  }

  .wheel-value.ghost { pointer-events: none; }

  .wheel-grip {
    position: absolute;
    top: 50%;
    right: 8px;
    color: #d6d8da;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-50%);
    transition: opacity .18s ease;
  }

  .wheel:hover .wheel-grip,
  .wheel:focus .wheel-grip { opacity: .55; }
  .wheel.is-dragging .wheel-grip { opacity: .8; }
  .wheel.is-inactive:hover .wheel-grip { opacity: .4; }



  /* ——— clean button ——— */

  .clean {
    width: 100%;
    height: 40px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 0;
    border-radius: 999px;
    background: #f4f4f6;
    color: #1c1c1e;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .22);
    transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
  }

  .clean:hover {
    background: #fff;
    transform: scale(1.012);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .28);
  }

  .clean:active { transform: scale(.992); }

  .clean svg { flex: 0 0 auto; }

  /* ——— footer ——— */

  .footer {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .toggle {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
  }

  .toggle input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .toggle .label {
    font-size: 11px;
    font-weight: 500;
    color: var(--secondary);
    white-space: nowrap;
  }

  .switch {
    position: relative;
    flex: 0 0 auto;
    width: 24px;
    height: 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .16);
    transition: background .18s ease;
  }

  .switch::after {
    content: "";
    position: absolute;
    top: 1.5px;
    left: 1.5px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .35);
    transition: transform .2s cubic-bezier(.2, .8, .2, 1);
  }

  .toggle input:checked + .switch { background: #0a84ff; }
  .toggle input:checked + .switch::after { transform: translateX(10px); }
  .toggle input:focus-visible + .switch {
    outline: 2px solid rgba(10, 132, 255, .85);
    outline-offset: 2px;
  }

  .power {
    margin-left: auto;
    width: 20px;
    height: 20px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--tertiary);
    cursor: pointer;
    transition: color .16s ease, background .16s ease;
  }

  .power:hover {
    color: var(--secondary);
    background: rgba(255, 255, 255, .06);
  }

  /* ——— hint ——— */

  .hint {
    margin: 0;
    max-width: 360px;
    font-size: 12px;
    line-height: 1.7;
    text-align: center;
    color: rgba(235, 235, 245, .38);
  }

  @media (prefers-reduced-motion: reduce) {
    .popover { animation: none; }
    .card, .wheel, .all-btn, .clean, .switch, .switch::after { transition: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="popover" aria-label="Screenshot Cleaner">
      <div class="hero">
        <div class="hero-copy">
          <div class="count" id="count">13</div>
          <div class="summary" id="summary">of 18 screenshots</div>
          <div class="summary dim" id="size">7.4 MB</div>
        </div>

        <div class="stack" aria-hidden="true">
          <div class="card back"></div>
          <div class="card purple"></div>
          <div class="card yellow">
            <div class="browser">
              <div class="browser-bar"><i></i><i></i><i></i></div>
              <div class="browser-body">
                <div class="browser-side"></div>
                <div class="browser-lines"><span></span><span></span><span></span><span></span></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="age-row">
        <span class="caption" id="caption">Older than</span>
        <div class="picker">
          <button class="all-btn" id="allBtn" type="button" aria-pressed="false">All</button>
          <div class="wheel is-active" id="wheel" role="spinbutton" tabindex="0"
               aria-label="Days old" aria-valuemin="1" aria-valuemax="30"
               aria-valuenow="7" aria-valuetext="7 days" aria-orientation="vertical"
               title="Drag up or down to choose 1–30 days">
            <div class="wheel-window">
              <div class="wheel-value" id="wheelValue" aria-hidden="true">
                <span class="val"><span class="num">7</span><span class="unit">days</span></span>
              </div>
            </div>
            <svg class="wheel-grip" width="7" height="11" viewBox="0 0 7 11" fill="currentColor" aria-hidden="true">
              <circle cx="1.5" cy="1.5" r=".9"/><circle cx="5.5" cy="1.5" r=".9"/>
              <circle cx="1.5" cy="5.5" r=".9"/><circle cx="5.5" cy="5.5" r=".9"/>
              <circle cx="1.5" cy="9.5" r=".9"/><circle cx="5.5" cy="9.5" r=".9"/>
            </svg>
          </div>
        </div>
      </div>

      <button class="clean" type="button">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 4.5h10M6.5 4.5v-1c0-.55.45-1 1-1h1c.55 0 1 .45 1 1v1M4.6 4.5l.58 8.05c.04.5.46.95.97.95h3.7c.51 0 .93-.45.97-.95l.58-8.05" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Move to Trash
      </button>

      <div class="footer">
        <label class="toggle">
          <input type="checkbox" id="autoClean">
          <span class="switch"></span>
          <span class="label">Auto-clean</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="recordings">
          <span class="switch"></span>
          <span class="label">Recordings</span>
        </label>
        <button class="power" type="button" aria-label="Quit" title="Quit">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 2.2v5.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M4.35 4.3a5 5 0 1 0 7.3 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </section>

    <p class="hint">
      Hold and drag to pick 1–30 days · All means any age
    </p>
  </main>

<script>
(() => {
  "use strict";

  const MAX_INDEX = 29;
  const TOTAL = 18;

  const wheel = document.getElementById("wheel");
  const wheelValue = document.getElementById("wheelValue");
  const allBtn = document.getElementById("allBtn");
  const captionEl = document.getElementById("caption");
  const countEl = document.getElementById("count");
  const summaryEl = document.getElementById("summary");
  const sizeEl = document.getElementById("size");

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let days = 7;            // 0 means "All"
  let lastDays = 7;        // remembered while All is selected
  let valuePos = lastDays - 1; // continuous drag position, 0…29
  let displayedValue = null;

  let dragging = false;
  let dragStartY = 0;
  let dragStartValue = 0;
  let dragMoved = false;
  let dragActivated = false;

  const PIXELS_PER_DAY = 10;

  let currentCount = null;
  let currentCaption = "Older than";

  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

  function cleanable(forDays) {
    if (forDays === 0) return TOTAL;
    return Math.min(TOTAL, Math.max(1, Math.round(TOTAL * (1 - Math.exp(-forDays / 5.5)))));
  }

  function formatSize(count) {
    return `${(count * 0.57).toFixed(1)} MB`;
  }

  function wheelValueMarkup(value) {
    if (value === 0) {
      return `<span class="val"><span class="num word">Any</span></span>`;
    }

    return `<span class="val"><span class="num">${value}</span><span class="unit">${value === 1 ? "day" : "days"}</span></span>`;
  }

  function setWheelValue(next) {
    if (next === displayedValue) return;

    if (displayedValue === null) {
      displayedValue = next;
      wheelValue.innerHTML = wheelValueMarkup(next);
      return;
    }

    const direction = next > displayedValue ? 1 : -1;
    const old = wheelValue.cloneNode(true);

    old.removeAttribute("id");
    old.classList.add("ghost");

    wheelValue.getAnimations().forEach((animation) => animation.cancel());
    wheel.querySelectorAll(".ghost").forEach((ghost) => ghost.remove());
    wheelValue.parentElement.appendChild(old);

    displayedValue = next;
    wheelValue.innerHTML = wheelValueMarkup(next);

    if (reduceMotion) {
      old.remove();
      return;
    }

    old.animate(
      [
        { transform: "translateY(0)", opacity: 1 },
        { transform: `translateY(${-direction * 20}px)`, opacity: 0 }
      ],
      { duration: 160, easing: "cubic-bezier(.2,.8,.2,1)" }
    ).onfinish = () => old.remove();

    wheelValue.animate(
      [
        { transform: `translateY(${direction * 20}px)`, opacity: 0 },
        { transform: "translateY(0)", opacity: 1 }
      ],
      { duration: 190, easing: "cubic-bezier(.2,.8,.2,1)" }
    );
  }

  function setCount(next) {
    if (next === currentCount) return;

    const firstRender = currentCount === null;
    currentCount = next;
    countEl.textContent = String(next);

    if (!firstRender && !reduceMotion) {
      countEl.animate(
        [
          { opacity: .35, transform: "translateY(3px) scale(.98)" },
          { opacity: 1, transform: "none" }
        ],
        { duration: 210, easing: "cubic-bezier(.2,.8,.2,1)" }
      );
    }
  }

  function setCaption(next) {
    if (next === currentCaption) return;
    currentCaption = next;
    captionEl.textContent = next;

    if (!reduceMotion) {
      captionEl.animate(
        [
          { opacity: .2, transform: "translateY(1px)" },
          { opacity: 1, transform: "none" }
        ],
        { duration: 170, easing: "ease-out" }
      );
    }
  }

  function renderSelection() {
    const isAll = days === 0;
    const shownDays = isAll ? lastDays : days;
    const count = isAll ? TOTAL : cleanable(days);

    if (isAll) valuePos = lastDays - 1;

    wheel.classList.toggle("is-active", !isAll);
    wheel.classList.toggle("is-inactive", isAll);
    allBtn.classList.toggle("selected", isAll);
    allBtn.setAttribute("aria-pressed", String(isAll));

    setCaption(isAll ? "Any age" : "Older than");

    wheel.setAttribute("aria-valuenow", String(shownDays));
    wheel.setAttribute("aria-valuetext", isAll ? "Any age" : `${shownDays} day${shownDays === 1 ? "" : "s"}`);

    setWheelValue(isAll ? 0 : shownDays);
    setCount(count);
    summaryEl.textContent = count < TOTAL ? `of ${TOTAL} screenshots` : "screenshots";
    sizeEl.textContent = formatSize(count);
  }

  function syncDaysFromValuePos(force = false) {
    const next = Math.round(valuePos) + 1;
    if (next === days && !force) return;
    days = next;
    lastDays = next;
    renderSelection();
  }

  function activateWheel() {
    if (days !== 0) return false;
    days = lastDays;
    valuePos = lastDays - 1;
    return true;
  }

  wheel.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;

    event.preventDefault();
    wheel.focus({ preventScroll: true });

    dragging = true;
    dragMoved = false;
    dragActivated = false;
    dragStartY = event.clientY;
    dragStartValue = days === 0 ? lastDays - 1 : valuePos;

    wheel.classList.add("is-dragging");

    try { wheel.setPointerCapture(event.pointerId); } catch (_) {}
  });

  wheel.addEventListener("pointermove", (event) => {
    if (!dragging) return;

    const travel = event.clientY - dragStartY;

    if (!dragMoved && Math.abs(travel) < 4) return;

    if (!dragMoved) {
      dragMoved = true;

      if (days === 0) {
        activateWheel();
        dragActivated = true;
      }
    }

    valuePos = clamp(dragStartValue - travel / PIXELS_PER_DAY, 0, MAX_INDEX);
    syncDaysFromValuePos(dragActivated);
    dragActivated = false;
  });

  function endDrag(event) {
    if (!dragging) return;

    dragging = false;
    wheel.classList.remove("is-dragging");

    if (dragMoved) {
      valuePos = Math.round(valuePos);
      syncDaysFromValuePos();
    }

    dragMoved = false;
    dragActivated = false;

    try { wheel.releasePointerCapture(event.pointerId); } catch (_) {}
  }

  wheel.addEventListener("pointerup", endDrag);
  wheel.addEventListener("pointercancel", endDrag);

  wheel.addEventListener("keydown", (event) => {
    let base = days === 0 ? lastDays - 1 : days - 1;
    let handled = true;

    switch (event.key) {
      case "ArrowUp":
      case "ArrowLeft":
        base -= 1;
        break;
      case "ArrowDown":
      case "ArrowRight":
        base += 1;
        break;
      case "PageUp":
        base -= 5;
        break;
      case "PageDown":
        base += 5;
        break;
      case "Home":
        base = 0;
        break;
      case "End":
        base = MAX_INDEX;
        break;
      default:
        handled = false;
    }

    if (!handled) return;

    event.preventDefault();
    const wasAll = activateWheel();
    valuePos = clamp(base, 0, MAX_INDEX);
    syncDaysFromValuePos(wasAll);
  });

  allBtn.addEventListener("click", () => {
    if (days === 0) return;

    lastDays = days;
    valuePos = days - 1;
    days = 0;
    renderSelection();
  });

  renderSelection();
})();
</script>
</body>
</html>
